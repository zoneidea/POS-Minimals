name: posjung-agent installers
on:
  push:
    tags: ['print-agent-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test -w @pos/print-agent
      - run: npm run test:electron -w @pos/print-agent
      - name: Package installer
        working-directory: apps/print-agent
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/print-agent/release/*.exe
            apps/print-agent/release/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/print-agent-v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: |
          sha256sum installers/* > installers/SHA256SUMS.txt
          gh release create "$AGENT_TAG" installers/* --repo "$AGENT_REPOSITORY" --title "posjung-agent $AGENT_TAG" --notes "Test release. Windows x64 and macOS Intel/Apple Silicon installers. Installers are not developer-signed/notarized. Thermal printer and driver verification required."
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TAG: ${{ github.ref_name }}
          AGENT_REPOSITORY: ${{ github.repository }}
