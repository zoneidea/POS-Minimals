openapi: 3.1.0
info:
  title: POS Minimal Shared API
  version: 1.0.0
  description: >-
    Phase 1 multi-tenant POS REST contract for React Web App and shared
    stateless Express API. JavaFX Desktop and native mobile clients are future
    extensibility targets, NOT Phase 1 deliverables. Initial API-first contract:
    field-level schemas for major transactional endpoints; tighten generic admin
    DTOs as implementation proceeds.

    Generic admin request/response types and multipart signed-upload variants
    must be constrained before production; see 07_API_CONTRACT.md. The security
    envelope is binding even for preliminary schemas.
servers:
  - url: https://api.example.com/api/v1
    description: Replace with actual deployment hostname
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase Auth JWT
  schemas:
    UUID:
      type: string
      format: uuid
    Money:
      type: string
      pattern: ^\d+\.\d{2}$
      examples:
        - "100.00"
        - "0.00"
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        requestId:
          $ref: "#/components/schemas/UUID"
      required:
        - success
        - error
        - requestId
    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
      required:
        - success
        - data
    UserContext:
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/UUID"
        orgId:
          $ref: "#/components/schemas/UUID"
        orgName:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - OWNER
            - EMPLOYEE
            - ACCOUNTANT
        permissions:
          type: array
          items:
            type: string
      required:
        - userId
        - orgId
        - orgName
        - username
        - role
        - permissions
    UserContextResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/UserContext"
      required:
        - success
        - data
    BootstrapRequest:
      type: object
      properties:
        storeName:
          type: string
          minLength: 1
          maxLength: 120
        displayUsername:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - storeName
        - displayUsername
      additionalProperties: false
    BootstrapResult:
      type: object
      properties:
        orgId:
          $ref: "#/components/schemas/UUID"
        role:
          type: string
          const: OWNER
        status:
          type: string
          const: ACTIVE
      required:
        - orgId
        - role
        - status
    BootstrapResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/BootstrapResult"
      required:
        - success
        - data
    Product:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        barcode:
          type: string
        name:
          type: string
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          $ref: "#/components/schemas/Money"
        quantityOnHand:
          type: integer
          minimum: 0
        rowVersion:
          type: integer
          minimum: 1
        imageUrl:
          type:
            - string
            - "null"
      required:
        - id
        - barcode
        - name
        - salePrice
        - quantityOnHand
        - rowVersion
    PosCatalogResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [items, total, page, limit]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - success
        - data
        - meta
    QuoteItemRequest:
      type: object
      properties:
        productId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity
      additionalProperties: false
    SaleItemRequest:
      type: object
      properties:
        productId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
          minimum: 1
        expectedUnitPrice:
          $ref: "#/components/schemas/Money"
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity
        - expectedUnitPrice
        - expectedVersion
      additionalProperties: false
    QuoteRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/QuoteItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          type: string
          enum:
            - CASH
            - PROMPTPAY
      required:
        - items
        - discountAmount
        - paymentMethod
      additionalProperties: false
    QuoteResponseData:
      type: object
      properties:
        quoteFingerprint:
          type: string
        items:
          type: array
          items:
            type: object
            required: [productId, barcode, name, quantity, unitPrice, expectedVersion, lineTotal, stockAvailable]
            properties:
              productId:
                $ref: '#/components/schemas/UUID'
              barcode:
                type: string
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 2147483647
              unitPrice:
                $ref: '#/components/schemas/Money'
              expectedVersion:
                type: integer
                minimum: 1
              lineTotal:
                $ref: '#/components/schemas/Money'
              stockAvailable:
                type: integer
                minimum: 0
        subtotalAmount:
          $ref: "#/components/schemas/Money"
        discountAmount:
          $ref: "#/components/schemas/Money"
        vatAmount:
          $ref: "#/components/schemas/Money"
        totalAmount:
          $ref: "#/components/schemas/Money"
        vatEnabled:
          type: boolean
        vatRate:
          $ref: '#/components/schemas/Money'
        promptpayQrPayload:
          type:
            - string
            - "null"
      required:
        - quoteFingerprint
        - items
        - subtotalAmount
        - discountAmount
        - vatAmount
        - vatEnabled
        - vatRate
        - totalAmount
    QuoteResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/QuoteResponseData"
      required:
        - success
        - data
    CashPayment:
      type: object
      properties:
        method:
          type: string
          const: CASH
        receivedAmount:
          $ref: "#/components/schemas/Money"
      required:
        - method
        - receivedAmount
      additionalProperties: false
    PromptpayPayment:
      type: object
      properties:
        method:
          type: string
          const: PROMPTPAY
        manualPaymentConfirmed:
          type: boolean
          const: true
      required:
        - method
        - manualPaymentConfirmed
      additionalProperties: false
    CashSaleRequest:
      type: object
      additionalProperties: false
      required: [items, discountAmount, expectedTotalAmount, payment]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/SaleItemRequest'
        discountAmount:
          $ref: '#/components/schemas/Money'
        expectedTotalAmount:
          $ref: '#/components/schemas/Money'
        payment:
          $ref: '#/components/schemas/CashPayment'
    SaleRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        expectedTotalAmount:
          $ref: "#/components/schemas/Money"
        payment:
          oneOf:
            - $ref: "#/components/schemas/CashPayment"
            - $ref: "#/components/schemas/PromptpayPayment"
      required:
        - items
        - discountAmount
        - expectedTotalAmount
        - payment
      additionalProperties: false
    ReceiptItem:
      type: object
      properties:
        barcode:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          $ref: "#/components/schemas/Money"
        discountAmount:
          $ref: "#/components/schemas/Money"
        lineTotal:
          $ref: "#/components/schemas/Money"
      required:
        - productName
        - quantity
        - unitPrice
        - lineTotal
    Receipt:
      type: object
      description: Immutable printer-neutral sale snapshot; void status may be
        overlaid without rewriting original amounts.
      properties:
        receiptSchemaVersion:
          type: integer
          const: 1
        saleId:
          $ref: "#/components/schemas/UUID"
        saleNo:
          type: string
        completedAtUtc:
          type: string
          format: date-time
        store:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
            phone:
              type: string
            taxId:
              type: string
            vatEnabled:
              type: boolean
            vatRate:
              $ref: "#/components/schemas/Money"
            footer:
              type: string
          required:
            - name
        cashierName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptItem"
        totals:
          type: object
          properties:
            subtotal:
              $ref: "#/components/schemas/Money"
            discount:
              $ref: "#/components/schemas/Money"
            vat:
              $ref: "#/components/schemas/Money"
            total:
              $ref: "#/components/schemas/Money"
            received:
              $ref: "#/components/schemas/Money"
            change:
              $ref: "#/components/schemas/Money"
          required:
            - subtotal
            - discount
            - vat
            - total
        paymentMethod:
          type: string
          enum:
            - CASH
            - PROMPTPAY
        saleStatus:
          type: string
          enum:
            - COMPLETED
            - VOIDED
      required:
        - receiptSchemaVersion
        - saleId
        - saleNo
        - completedAtUtc
        - store
        - items
        - totals
        - paymentMethod
        - saleStatus
    SaleResult:
      type: object
      properties:
        saleId:
          $ref: "#/components/schemas/UUID"
        saleNo:
          type: string
        status:
          type: string
          const: COMPLETED
        totalAmount:
          $ref: "#/components/schemas/Money"
        receivedAmount:
          $ref: "#/components/schemas/Money"
        changeAmount:
          $ref: "#/components/schemas/Money"
        replayed:
          type: boolean
        receipt:
          $ref: "#/components/schemas/Receipt"
      required:
        - saleId
        - saleNo
        - status
        - totalAmount
        - receivedAmount
        - changeAmount
        - receipt
    SaleResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/SaleResult"
      required:
        - success
        - data
    ReceiptResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/Receipt"
      required:
        - success
        - data
    StockAdjustRequest:
      type: object
      properties:
        delta:
          type: integer
          not:
            const: 0
        reason:
          type: string
          minLength: 1
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - delta
        - reason
        - expectedVersion
      additionalProperties: false
    VoidRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
        - reason
      additionalProperties: false
    ProductUpsert:
      type: object
      properties:
        barcode:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          $ref: "#/components/schemas/Money"
        unitCost:
          $ref: "#/components/schemas/Money"
        expectedVersion:
          type: integer
      required:
        - barcode
        - name
        - salePrice
        - unitCost
      additionalProperties: false
    ImportBatch:
      type: object
      properties:
        batchId:
          $ref: "#/components/schemas/UUID"
        expiresAt:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - batchId
        - expiresAt
        - errors
    InventoryProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            unitCost:
              $ref: "#/components/schemas/Money"
          required:
            - unitCost
      description: Owner-only view; never include unitCost in POS catalog for EMPLOYEE
    InventoryProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/InventoryProduct"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - success
        - data
        - meta
    ImportPreviewResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ImportBatch"
      required:
        - success
        - data
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
    CategoryInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    ProductInput:
      type: object
      additionalProperties: false
      required:
        - barcode
        - name
        - categoryId
        - salePrice
        - unitCost
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice: &a9
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        unitCost: *a9
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
        - barcode
        - name
        - categoryId
        - salePrice
        - unitCost
        - expectedVersion
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice: &a9
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        unitCost: *a9
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    ProductDelete:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    InventoryProductRecord:
      type: object
      required:
        - id
        - barcode
        - name
        - categoryId
        - salePrice
        - unitCost
        - quantity
        - version
        - imagePath
      properties:
        id:
          type: string
          format: uuid
        barcode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice: &a9
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        unitCost: *a9
        quantity:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        imagePath:
          type:
            - string
            - "null"
    StockAdjustmentRequest:
      type: object
      additionalProperties: false
      required:
        - delta
        - reason
        - expectedVersion
      properties:
        delta:
          type: integer
          minimum: -2147483647
          maximum: 2147483647
          not:
            const: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    StockMovement:
      type: object
      required:
        - id
        - productId
        - productName
        - barcode
        - delta
        - before
        - after
        - reason
        - actorUserId
        - actorUsername
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        barcode:
          type: string
        delta:
          type: integer
        before:
          type: integer
          minimum: 0
        after:
          type: integer
          minimum: 0
        reason:
          type: string
        actorUserId:
          type: string
          format: uuid
        actorUsername:
          type:
            - string
            - "null"
        updatedAt:
          type: string
          format: date-time
  responses:
    Ok:
      description: Standard JSON success
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericSuccess"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Email unverified, inactive membership or operation disallowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Identity or database provider unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Validation of business rule failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    File:
      description: Authenticated XLSX binary
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SaleId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AuditId:
      name: auditId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    Type:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum:
          - sales
          - inventory
          - low-stock
          - stock-valuation
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      schema:
        type: string
        enum:
          - WEB
          - JAVAFX
          - ANDROID
          - IOS
          - OTHER
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: getHealth
      x-roles:
        - public
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401": &a1
          $ref: "#/components/responses/Unauthorized"
        "409": &a2
          $ref: "#/components/responses/Conflict"
        "422": &a3
          $ref: "#/components/responses/Unprocessable"
      security: []
      parameters:
        - &a4
          $ref: "#/components/parameters/ClientPlatform"
        - &a5
          $ref: "#/components/parameters/ClientVersion"
  /client/config:
    get:
      tags:
        - System
      operationId: getClientConfig
      summary: getClientConfig
      x-roles:
        - public
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401": *a1
        "409": *a2
        "422": *a3
      security: []
      parameters:
        - *a4
        - *a5
  /orgs/bootstrap:
    post:
      tags:
        - Identity
      operationId: bootstrapOrganization
      summary: bootstrapOrganization
      x-roles:
        - Authenticated
      responses:
        "200": &a6
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "201": *a6
        "400":
          $ref: "#/components/responses/BadRequest"
        "401": *a1
        "403":
          $ref: "#/components/responses/Forbidden"
        "409": *a2
        "422": *a3
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      parameters:
        - *a4
        - *a5
  /auth/me:
    get:
      tags:
        - Identity
      operationId: getCurrentUser
      summary: getCurrentUser
      x-roles:
        - Authenticated
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContextResponse"
        "401": *a1
        "409": *a2
        "422": *a3
      parameters:
        - *a4
        - *a5
  /users:
    get:
      tags:
        - Identity
      operationId: listUsers
      summary: listUsers
      x-roles:
        - OWNER
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401": *a1
        "409": *a2
        "422": *a3
      parameters:
        - *a4
        - *a5
  /users/invitations:
    post:
      tags:
        - Identity
      operationId: inviteUser
      summary: inviteUser
      x-roles:
        - OWNER
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401": *a1
        "409": *a2
        "422": *a3
      parameters:
        - *a4
        - *a5
  /users/{memberId}:
    patch:
      tags:
        - Identity
      operationId: updateUser
      summary: updateUser
      x-roles:
        - OWNER
