  /payments/gateway/initiate:
    post:
      summary: Authorize the existing ReservePay PromptPay session using a live server quote
      x-roles: [OWNER, EMPLOYEE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, discountAmount, sessionId, expectedTotalAmount]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [productId, quantity]
                    properties:
                      productId: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 2147483647}
                couponCode: { $ref: "#/components/schemas/CouponCode" }
                discountAmount: {type: string, pattern: '^(0|[1-9][0-9]{0,11})\.[0-9]{2}$'}
                sessionId: {type: string, pattern: '^[A-Za-z0-9_-]{6,200}$'}
                expectedTotalAmount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
      responses:
        '200':
          description: Provider accepted initiation; does not indicate payment or sale completion
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    required: [initiated]
                    properties:
                      initiated: {const: true}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Gateway disabled, changed quote or previously bound session}
        '502': {description: Provider rejected initiation}
        '503': {description: Not configured, ledger unavailable or uncertain provider response}
  /payments/gateway/confirm:
    post:
      summary: Verify provider payment server-side and atomically post its bound sale
      x-roles: [OWNER, EMPLOYEE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId]
              properties:
                sessionId: {type: string, pattern: '^[A-Za-z0-9_-]{6,200}$'}
      responses:
        '200':
          description: Provider status and completed sale only when posted successfully
          content:
            application/json:
