openapi: 3.1.0
info:
  title: POS Minimal Shared API
  version: 1.0.0
  description: >-
    Phase 1 multi-tenant POS REST contract for React Web App and shared
    stateless Express API. JavaFX Desktop and native mobile clients are future
    extensibility targets, NOT Phase 1 deliverables. Initial API-first contract:
    field-level schemas for major transactional endpoints; tighten generic admin
    DTOs as implementation proceeds.

    Generic admin request/response types and multipart signed-upload variants
    must be constrained before production; see 07_API_CONTRACT.md. The security
    envelope is binding even for preliminary schemas.
servers:
  - url: https://api.example.com/api/v1
    description: Replace with actual deployment hostname
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase Auth JWT
  schemas:
    ActivityLog:
      type: object
      required:
        - id
        - action
        - entityId
        - actorUsername
        - requestId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        entityId:
          type: string
          format: uuid
        actorUsername:
          type:
            - string
            - "null"
        requestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    UUID:
      type: string
      format: uuid
    Money:
      type: string
      pattern: ^\d+\.\d{2}$
      examples:
        - "100.00"
        - "0.00"
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        requestId:
          $ref: "#/components/schemas/UUID"
      required:
        - success
        - error
        - requestId
    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
      required:
        - success
        - data
    UserContext:
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/UUID"
        orgId:
          $ref: "#/components/schemas/UUID"
        orgName:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - OWNER
            - EMPLOYEE
            - ACCOUNTANT
        permissions:
          type: array
          items:
            type: string
      required:
        - userId
        - orgId
        - orgName
        - username
        - role
        - permissions
    UserContextResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/UserContext"
      required:
        - success
        - data
    BootstrapRequest:
      type: object
      properties:
        storeName:
          type: string
          minLength: 1
          maxLength: 120
        displayUsername:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: '^0[0-9]{8,9}$'
          maxLength: 10
      required:
        - storeName
        - displayUsername
        - phone
      additionalProperties: false
    BootstrapResult:
      type: object
      properties:
        orgId:
          $ref: "#/components/schemas/UUID"
        role:
          type: string
          const: OWNER
        status:
          type: string
          const: ACTIVE
        reservePayStatus:
          type: string
          enum: [PENDING, SENT, FAILED, UNKNOWN, NOT_CONFIGURED]
          description: External contact sync result; store provisioning succeeds independently
      required:
        - orgId
        - role
        - status
    BootstrapResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/BootstrapResult"
      required:
        - success
        - data
    Product:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        barcode:
          type: string
        name:
          type: string
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          $ref: "#/components/schemas/Money"
        quantityOnHand:
          type: integer
          minimum: 0
        rowVersion:
          type: integer
          minimum: 1
        imageUrl:
          description: Private signed image URL; POS catalog prefers a 600x440-bounded WebP thumbnail with original-image fallback. URLs can be reused for up to 10 minutes within the same API instance and user-token scope.
          type:
            - string
            - "null"
      required:
        - id
        - barcode
        - name
        - salePrice
        - quantityOnHand
        - rowVersion
    PosCatalogResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - items
            - total
            - page
            - limit
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Product"
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - success
        - data
        - meta
    QuoteItemRequest:
      type: object
      properties:
        productId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity
      additionalProperties: false
    SaleItemRequest:
      type: object
      properties:
        productId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
          minimum: 1
        expectedUnitPrice:
          $ref: "#/components/schemas/Money"
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity
        - expectedUnitPrice
        - expectedVersion
      additionalProperties: false
    QuoteRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/QuoteItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          type: string
          enum:
            - CASH
            - PROMPTPAY
      required:
        - items
        - discountAmount
        - paymentMethod
      additionalProperties: false
    QuoteResponseData:
      type: object
      properties:
        quoteFingerprint:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - barcode
              - name
              - quantity
              - unitPrice
              - expectedVersion
              - lineTotal
              - stockAvailable
            properties:
              productId:
                $ref: "#/components/schemas/UUID"
              barcode:
                type: string
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 2147483647
              unitPrice:
                $ref: "#/components/schemas/Money"
              expectedVersion:
                type: integer
                minimum: 1
              lineTotal:
                $ref: "#/components/schemas/Money"
              stockAvailable:
                type: integer
                minimum: 0
        subtotalAmount:
          $ref: "#/components/schemas/Money"
        discountAmount:
          $ref: "#/components/schemas/Money"
        vatAmount:
          $ref: "#/components/schemas/Money"
        totalAmount:
          $ref: "#/components/schemas/Money"
        vatEnabled:
          type: boolean
        vatRate:
          $ref: "#/components/schemas/Money"
        promptpayQrPayload:
          type:
            - string
            - "null"
      required:
        - quoteFingerprint
        - items
        - subtotalAmount
        - discountAmount
        - vatAmount
        - vatEnabled
        - vatRate
        - totalAmount
    QuoteResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/QuoteResponseData"
      required:
        - success
        - data
    CashPayment:
      type: object
      properties:
        method:
          type: string
          const: CASH
        receivedAmount:
          $ref: "#/components/schemas/Money"
      required:
        - method
        - receivedAmount
      additionalProperties: false
    PromptpayPayment:
      type: object
      properties:
        method:
          type: string
          const: PROMPTPAY
        manualPaymentConfirmed:
          type: boolean
          const: true
      required:
        - method
        - manualPaymentConfirmed
      additionalProperties: false
    CashSaleRequest:
      type: object
      additionalProperties: false
      required:
        - items
        - discountAmount
        - expectedTotalAmount
        - payment
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SaleItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        expectedTotalAmount:
          $ref: "#/components/schemas/Money"
        payment:
          $ref: "#/components/schemas/CashPayment"
    SaleRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        expectedTotalAmount:
          $ref: "#/components/schemas/Money"
        payment:
          oneOf:
            - $ref: "#/components/schemas/CashPayment"
            - $ref: "#/components/schemas/PromptpayPayment"
      required:
        - items
        - discountAmount
        - expectedTotalAmount
        - payment
      additionalProperties: false
    ReceiptItem:
      type: object
      properties:
        barcode:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          $ref: "#/components/schemas/Money"
        discountAmount:
          $ref: "#/components/schemas/Money"
        lineTotal:
          $ref: "#/components/schemas/Money"
      required:
        - productName
        - quantity
        - unitPrice
        - lineTotal
    Receipt:
      type: object
      description: Immutable printer-neutral sale snapshot; void status may be
        overlaid without rewriting original amounts.
      properties:
        receiptSchemaVersion:
          type: integer
          const: 1
        saleId:
          $ref: "#/components/schemas/UUID"
        saleNo:
          type: string
        completedAtUtc:
          type: string
          format: date-time
        store:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
            phone:
              type: string
            taxId:
              type: string
            vatEnabled:
              type: boolean
            vatRate:
              $ref: "#/components/schemas/Money"
            footer:
              type: string
          required:
            - name
        cashierName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptItem"
        totals:
          type: object
          properties:
            subtotal:
              $ref: "#/components/schemas/Money"
            discount:
              $ref: "#/components/schemas/Money"
            vat:
              $ref: "#/components/schemas/Money"
            total:
              $ref: "#/components/schemas/Money"
            received:
              $ref: "#/components/schemas/Money"
            change:
              $ref: "#/components/schemas/Money"
          required:
            - subtotal
            - discount
            - vat
            - total
        paymentMethod:
          type: string
          enum:
            - CASH
            - PROMPTPAY
        saleStatus:
          type: string
          enum:
            - COMPLETED
            - VOIDED
      required:
        - receiptSchemaVersion
        - saleId
        - saleNo
        - completedAtUtc
        - store
        - items
        - totals
        - paymentMethod
        - saleStatus
    SaleResult:
      type: object
      properties:
        saleId:
          $ref: "#/components/schemas/UUID"
        saleNo:
          type: string
        status:
          type: string
          const: COMPLETED
        totalAmount:
          $ref: "#/components/schemas/Money"
        receivedAmount:
          $ref: "#/components/schemas/Money"
        changeAmount:
          $ref: "#/components/schemas/Money"
        replayed:
          type: boolean
        receipt:
          $ref: "#/components/schemas/Receipt"
      required:
        - saleId
        - saleNo
        - status
        - totalAmount
        - receivedAmount
        - changeAmount
        - receipt
    SaleResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/SaleResult"
      required:
        - success
        - data
    ReceiptResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/Receipt"
      required:
        - success
        - data
    StockAdjustRequest:
      type: object
      properties:
        delta:
          type: integer
          not:
            const: 0
        reason:
          type: string
          minLength: 1
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - delta
        - reason
        - expectedVersion
      additionalProperties: false
    VoidRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - reason
      additionalProperties: false
    ProductUpsert:
      type: object
      properties:
        barcode:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          $ref: "#/components/schemas/Money"
        unitCost:
          $ref: "#/components/schemas/Money"
        expectedVersion:
          type: integer
      required:
        - barcode
        - name
        - salePrice
        - unitCost
      additionalProperties: false
    ImportBatch:
      type: object
      required:
        - batchId
        - expiresAt
        - rows
        - errors
        - status
        - importedCount
      properties:
        batchId:
          $ref: "#/components/schemas/UUID"
        expiresAt:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            required:
              - row
              - barcode
              - name
              - category
              - salePrice
              - unitCost
              - quantity
            properties:
              row:
                type: integer
              barcode:
                type: string
              name:
                type: string
              category:
                type: string
              salePrice:
                $ref: "#/components/schemas/Money"
              unitCost:
                $ref: "#/components/schemas/Money"
              quantity:
                type: integer
                minimum: 0
        errors:
          type: array
          items:
            type: object
            required:
              - row
              - message
            properties:
              row:
                type: integer
              message:
                type: string
        status:
          type: string
          enum:
            - READY
            - INVALID
            - COMMITTED
        importedCount:
          type: integer
    InventoryProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            unitCost:
              $ref: "#/components/schemas/Money"
          required:
            - unitCost
      description: Owner-only view; never include unitCost in POS catalog for EMPLOYEE
    InventoryProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/InventoryProduct"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - success
        - data
        - meta
    ImportPreviewResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ImportBatch"
      required:
        - success
        - data
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
    CategoryInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    ProductInput:
      type: object
      additionalProperties: false
      required:
        - barcode
        - name
        - categoryId
        - salePrice
        - unitCost
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        unitCost:
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
        - barcode
        - name
        - categoryId
        - salePrice
        - unitCost
        - expectedVersion
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        unitCost:
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    ProductDelete:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    InventoryProductRecord:
      type: object
      required:
        - id
        - barcode
        - name
        - categoryId
        - salePrice
        - unitCost
        - quantity
        - version
        - imagePath
      properties:
        imageUrl:
          description: Private signed image URL; POS catalog prefers a 600x440-bounded WebP thumbnail with original-image fallback. URLs can be reused for up to 10 minutes within the same API instance and user-token scope.
          type:
            - string
            - "null"
          format: uri
        id:
          type: string
          format: uuid
        barcode:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        unitCost:
          type: string
          pattern: ^(0|[1-9]\d{0,11})(\.\d{1,2})?$
          example: "0.00"
        quantity:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        imagePath:
          type:
            - string
            - "null"
    StockAdjustmentRequest:
      type: object
      additionalProperties: false
      required:
        - delta
        - reason
        - expectedVersion
      properties:
        delta:
          type: integer
          minimum: -2147483647
          maximum: 2147483647
          not:
            const: 0
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    StockMovement:
      type: object
      required:
        - id
        - productId
        - productName
        - barcode
        - delta
        - before
        - after
        - reason
        - actorUserId
        - actorUsername
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        barcode:
          type: string
        delta:
          type: integer
        before:
          type: integer
          minimum: 0
        after:
          type: integer
          minimum: 0
        reason:
          type: string
        actorUserId:
          type: string
          format: uuid
        actorUsername:
          type:
            - string
            - "null"
        updatedAt:
          type: string
          format: date-time
    SaleSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        saleNo:
          type: string
        status:
          type: string
          enum:
            - COMPLETED
            - VOIDED
        totalAmount:
          $ref: "#/components/schemas/Money"
        completedAtUtc:
          type: string
          format: date-time
        voidDeadlineUtc:
          type: string
          format: date-time
        voidedAtUtc:
          type:
            - string
            - "null"
          format: date-time
        voidReason:
          type:
            - string
            - "null"
        cashierName:
          type: string
        itemCount:
          type: integer
          minimum: 0
        paymentMethod:
          type: string
          enum:
            - CASH
            - PROMPTPAY
        receivedAmount:
          $ref: "#/components/schemas/Money"
      required:
        - id
        - saleNo
        - status
        - totalAmount
        - completedAtUtc
        - voidDeadlineUtc
        - voidedAtUtc
        - voidReason
        - cashierName
        - itemCount
        - paymentMethod
        - receivedAmount
      additionalProperties: false
    SaleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleSummary"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          const: 10
      required:
        - items
        - total
        - page
        - limit
      additionalProperties: false
    VoidResult:
      type: object
      properties:
        saleId:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
          const: VOIDED
        voidedAtUtc:
          type: string
          format: date-time
        replayed:
          type: boolean
      required:
        - saleId
        - status
        - voidedAtUtc
        - replayed
      additionalProperties: false
    StoreSettings:
      type: object
      properties:
        storeName:
          type: string
          maxLength: 120
          minLength: 1
        address:
          type: string
          maxLength: 1000
        phone:
          type: string
          maxLength: 30
        taxId:
          type: string
          pattern: ^(|[0-9]{13})$
        promptpayIdentifier:
          type: string
          pattern: ^(|[0-9]{10}|[0-9]{13})$
        receiptFooter:
          type: string
          maxLength: 1000
        vatEnabled:
          type: boolean
        vatRate:
          type: string
          pattern: ^(0|[1-9][0-9]{0,2})\.[0-9]{2}$
          description: 0.00–100.00; inclusive VAT only
        autoOpenPrintDialog:
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
        - storeName
        - address
        - phone
        - taxId
        - promptpayIdentifier
        - receiptFooter
        - vatEnabled
        - vatRate
        - autoOpenPrintDialog
        - version
      additionalProperties: false
    StaffMember:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        alias:
          type: string
          maxLength: 80
        role:
          type: string
          enum:
            - OWNER
            - EMPLOYEE
            - ACCOUNTANT
        status:
          type: string
          enum:
            - INVITED
            - ACTIVE
            - SUSPENDED
        version:
          type: integer
          minimum: 1
      required:
        - id
        - alias
        - role
        - status
        - version
      additionalProperties: false
    StaffList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          const: 10
      required:
        - items
        - total
        - page
        - limit
      additionalProperties: false
    StaffUpdate:
      type: object
      properties:
        role:
          type: string
          enum:
            - EMPLOYEE
            - ACCOUNTANT
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DELETED
        version:
          type: integer
          minimum: 1
      required:
        - role
        - status
        - version
      additionalProperties: false
    StaffInvitation:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
            - EMPLOYEE
            - ACCOUNTANT
      required:
        - email
        - role
      additionalProperties: false
    InviteAcceptance:
      type: object
      properties:
        alias:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - alias
      additionalProperties: false
    VersionResult:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
      required:
        - version
      additionalProperties: false
    InvitationResult:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
      required:
        - id
      additionalProperties: false
    AcceptanceResult:
      type: object
      properties:
        orgId:
          $ref: "#/components/schemas/UUID"
      required:
        - orgId
      additionalProperties: false
    InvitationContext:
      type: object
      properties:
        orgName:
          type: string
        role:
          type: string
          enum:
            - EMPLOYEE
            - ACCOUNTANT
      required:
        - orgName
        - role
      additionalProperties: false
    ReportData:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: sales
            summary:
              type: object
              properties:
                gross:
                  type: string
                  pattern: ^\d+\.\d{2}$
                discount:
                  type: string
                  pattern: ^\d+\.\d{2}$
                net:
                  type: string
                  pattern: ^\d+\.\d{2}$
                vat:
                  type: string
                  pattern: ^\d+\.\d{2}$
                billCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                voidCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                voidAmount:
                  type: string
                  pattern: ^\d+\.\d{2}$
              required:
                - gross
                - discount
                - net
                - vat
                - billCount
                - voidCount
                - voidAmount
              additionalProperties: false
            items:
              type: array
              items:
                type: object
                properties:
                  gross:
                    type: string
                    pattern: ^\d+\.\d{2}$
                  discount:
                    type: string
                    pattern: ^\d+\.\d{2}$
                  net:
                    type: string
                    pattern: ^\d+\.\d{2}$
                  vat:
                    type: string
                    pattern: ^\d+\.\d{2}$
                  billCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  voidCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  voidAmount:
                    type: string
                    pattern: ^\d+\.\d{2}$
                  period:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                required:
                  - gross
                  - discount
                  - net
                  - vat
                  - billCount
                  - voidCount
                  - voidAmount
                  - period
                additionalProperties: false
            total:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            page:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            limit:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
          required:
            - type
            - summary
            - items
            - total
            - page
            - limit
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              enum:
                - inventory
                - low-stock
                - stock-valuation
            summary:
              type: object
              properties:
                productCount:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                quantity:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                valuation:
                  type: string
                  pattern: ^\d+\.\d{2}$
              required:
                - productCount
                - quantity
                - valuation
              additionalProperties: false
            items:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  barcode:
                    type: string
                  name:
                    type: string
                  quantity:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  unitCost:
                    type: string
                    pattern: ^\d+\.\d{2}$
                  salePrice:
                    type: string
                    pattern: ^\d+\.\d{2}$
                  valuation:
                    type: string
                    pattern: ^\d+\.\d{2}$
                required:
                  - id
                  - barcode
                  - name
                  - quantity
                  - unitCost
                  - salePrice
                  - valuation
                additionalProperties: false
            total:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            page:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            limit:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
          required:
            - type
            - summary
            - items
            - total
            - page
            - limit
          additionalProperties: false
    DashboardSummary:
      type: object
      properties:
        todaySales:
          type: string
          pattern: ^\d+\.\d{2}$
        monthSales:
          type: string
          pattern: ^\d+\.\d{2}$
        todayBills:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        todayVoids:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        lowStockCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        dateBangkok:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        cashToday:
          type: string
          pattern: ^\d+\.\d{2}$
        promptpayToday:
          type: string
          pattern: ^\d+\.\d{2}$
        topProducts:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              name:
                type: string
              barcode:
                type: string
              quantity:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              net:
                type: string
                pattern: ^\d+\.\d{2}$
            required:
              - productId
              - name
              - barcode
              - quantity
              - net
            additionalProperties: false
      required:
        - todaySales
        - monthSales
        - todayBills
        - todayVoids
        - lowStockCount
        - dateBangkok
        - cashToday
        - promptpayToday
        - topProducts
      additionalProperties: false
    ReportCashiers:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          alias:
            type: string
        required:
          - id
          - alias
        additionalProperties: false
    ProductRankingsResult:
      type: object
      required:
        - days
        - fromBangkok
        - toBangkok
        - topProducts
        - slowProducts
      properties:
        days:
          type: integer
          enum:
            - 7
            - 15
            - 30
        fromBangkok:
          type: string
          format: date
        toBangkok:
          type: string
          format: date
        topProducts:
          type: array
          maxItems: 5
          items:
            type: object
            required:
              - productId
              - name
              - barcode
              - quantity
            properties:
              productId:
                type: string
                format: uuid
              name:
                type: string
              barcode:
                type: string
              quantity:
                type: integer
                minimum: 0
        slowProducts:
          type: array
          maxItems: 5
          items:
            type: object
            required:
              - productId
              - name
              - barcode
              - quantity
              - stockQuantity
            properties:
              productId:
                type: string
                format: uuid
              name:
                type: string
              barcode:
                type: string
              quantity:
                type: integer
                minimum: 0
              stockQuantity:
                type: integer
                minimum: 1
        idleProducts:
          type: array
          maxItems: 5
          description: Top five active in-stock products by Bangkok calendar days from
            creation through latest completed sale, or through today if never
            sold, with span at least days. Voided/future/pre-creation sales
            excluded. idleDays retains the legacy field name for this span.
          items:
            type: object
            required:
              - productId
              - name
              - barcode
              - stockQuantity
              - idleDays
              - sinceDate
            properties:
              productId:
                type: string
                format: uuid
              name:
                type: string
              barcode:
                type: string
              stockQuantity:
                type: integer
                minimum: 1
              idleDays:
                type: integer
                minimum: 0
              sinceDate:
                type: string
                format: date
                description: Product creation date in Bangkok.
              lastSaleDate:
                type:
                  - string
                  - "null"
                format: date
                description: Latest completed sale date in Bangkok; null for never-sold
                  products, whose span ends today.
  responses:
    Ok:
      description: Standard JSON success
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericSuccess"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Email unverified, inactive membership or operation disallowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Identity or database provider unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Validation of business rule failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    File:
      description: Authenticated XLSX binary
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    NotFound:
      description: Resource unavailable in the authenticated shop
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SaleId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AuditId:
      name: auditId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    Type:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum:
          - sales
          - inventory
          - low-stock
          - stock-valuation
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      schema:
        type: string
        enum:
          - WEB
          - JAVAFX
          - ANDROID
          - IOS
          - OTHER
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string
paths:
  /payments/config:
    get:
      operationId: getPaymentConfiguration
      summary: Active shop payment configuration; bank data is masked and omitted for employees
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration; gatewayReady is false until a provider is integrated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      mode:
                        enum: [DISABLED, UPLOAD, GATEWAY]
                      qrImage:
                        type: string
                      gatewayReady:
                        const: false
                      version:
                        type: integer
                      bankCode:
                        type: string
                      maskedAccountNumber:
                        type: string
                    required: [mode, qrImage, gatewayReady, version]
                required: [success, data]
  /settings/payments:
    patch:
      operationId: savePaymentConfiguration
      summary: Owner-only versioned payment configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  enum: [DISABLED, UPLOAD, GATEWAY]
                qrImage:
                  type: string
                  maxLength: 50000
                  description: PNG/JPEG data URL or empty; validated as a raster image
                bankCode:
                  type: string
                  description: Three-digit bank code from the supported bank list or empty
                accountNumber:
                  type: string
                  pattern: '^(|[0-9]{6,20})$'
                  description: Empty retains saved account; required when switching bank
                version:
                  type: integer
                  minimum: 1
              required: [mode, qrImage, bankCode, accountNumber, version]
      responses:
        '200':
          description: Updated version
        '400':
          description: Invalid settings
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Stale version
  /audits/activity-logs:
    get:
      summary: Owner activity history retained for 30 days
      operationId: listActivityLogs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: action
          schema:
            type: string
            pattern: ^[A-Z_]{1,60}$
      responses:
        "200":
          description: Tenant-scoped history, 10 rows per page
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required:
                      - items
                      - total
                      - page
                      - limit
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ActivityLog"
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        minimum: 1
                      limit:
                        const: 10
        "400":
          description: Invalid query
        "401":
          description: Authentication required
        "403":
          description: Owner required
        "503":
          description: History unavailable

  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: getHealth
      x-roles:
        - public
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
  /client/config:
    get:
      tags:
        - System
      operationId: getClientConfig
      summary: getClientConfig
      x-roles:
        - public
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
      security: []
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
  /orgs/bootstrap:
    post:
      tags:
        - Identity
      operationId: bootstrapOrganization
      summary: bootstrapOrganization
      x-roles:
        - Authenticated
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
  /auth/me:
    get:
      tags:
        - Identity
      operationId: getCurrentUser
      summary: getCurrentUser
      x-roles:
        - Authenticated
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
  /users:
    get:
      operationId: listStaffMembers
      tags:
        - Management
      x-roles:
        - OWNER
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/StaffList"
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Unauthorized"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unauthorized"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
  /users/invitations:
    post:
      operationId: inviteStaffMember
      tags:
        - Management
      x-roles:
        - OWNER
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/InvitationResult"
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Unauthorized"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitation"
  /users/{memberId}:
    patch:
      operationId: updateStaffMember
      tags:
        - Management
      x-roles:
        - OWNER
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/VersionResult"
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Unauthorized"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unauthorized"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /products:
    get:
      tags:
        - Catalog
      operationId: listPosProducts
      summary: Tenant-scoped POS product projection without costs
      x-roles:
        - OWNER
        - EMPLOYEE
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosCatalogResponse"
        "400":
          $ref: "#/components/responses/Unprocessable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unauthorized"
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
            description: Literal case-insensitive substring of name or barcode
        - name: barcode
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Exact barcode including leading zeros
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
  /inventory/products:
    get:
      summary: OWNER inventory list including cost; ten rows by default
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - items
                      - total
