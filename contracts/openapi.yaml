openapi: 3.1.0
info:
  title: KidTang Shared API
  version: 1.0.0
  description: >-
    Phase 1 multi-tenant POS REST contract for React Web App and shared
    stateless Express API. JavaFX Desktop and native mobile clients are future
    extensibility targets, NOT Phase 1 deliverables. Initial API-first contract:
    field-level schemas for major transactional endpoints; tighten generic admin
    DTOs as implementation proceeds.

    Generic admin request/response types and multipart signed-upload variants
    must be constrained before production; see 07_API_CONTRACT.md. The security
    envelope is binding even for preliminary schemas.
servers:
  - url: https://pos-minimals.vercel.app/api/v1
    description: KidTang deployed Web and shared API (same origin)
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase Auth JWT
  schemas:
    ClientConfig:
      type: object
      additionalProperties: false
      required: [apiVersion, minimumWebVersion, receiptSchemaVersion]
      properties:
        apiVersion:
          type: string
          const: v1
        minimumWebVersion:
          type: string
        receiptSchemaVersion:
          type: integer
          const: 1
        integration:
          type: object
          description: Public protocol metadata, opt-in via profile=integration. Does not authorize any user, shop or module. Native app builds are not yet released.
          additionalProperties: false
          required: [contractRevision, basePath, authProvider, tokenHeader, moneyEncoding, businessTimeZone, timestamps, pagination, identityPath, sessionPolicyPath, logoutPath, checkoutRecoveryPath, offlineCheckout, nativePaymentGatewayReady, modulePurchaseMode]
          properties:
            contractRevision:
              type: integer
              const: 1
            basePath:
              type: string
              const: /api/v1
            authProvider:
              type: string
              const: SUPABASE
            tokenHeader:
              type: string
              const: Authorization
            moneyEncoding:
              type: string
              const: decimal-string
            businessTimeZone:
              type: string
              const: Asia/Bangkok
            timestamps:
              type: string
              const: iso-8601
            pagination:
              type: string
              const: data
            identityPath:
              type: string
              const: /api/v1/auth/me
            sessionPolicyPath:
              type: string
              const: /api/v1/auth/session-policy
            logoutPath:
              type: string
              const: /api/v1/auth/logout
            checkoutRecoveryPath:
              type: string
              const: /api/v1/sales/by-idempotency-key/{key}
            offlineCheckout:
              type: boolean
              const: false
            nativePaymentGatewayReady:
              type: boolean
              const: false
            modulePurchaseMode:
              type: string
              const: DEMO
    CouponCode:
      type: string
      pattern: '^[A-Z0-9_-]{3,32}$'
    CouponInput:
      type: object
      additionalProperties: false
      required:
        - name
        - code
        - amount
        - startsOn
        - endsOn
        - maxUses
        - showOnReceipt
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          $ref: "#/components/schemas/CouponCode"
        amount:
          $ref: "#/components/schemas/Money"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        maxUses:
          type: integer
          minimum: 1
          maximum: 2147483647
        showOnReceipt:
          type: boolean
    CouponUpdate:
      type: object
      additionalProperties: false
      required:
        - name
        - code
        - amount
        - startsOn
        - endsOn
        - maxUses
        - showOnReceipt
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          $ref: "#/components/schemas/CouponCode"
        amount:
          $ref: "#/components/schemas/Money"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        maxUses:
          type: integer
          minimum: 1
          maximum: 2147483647
        showOnReceipt:
          type: boolean
        version:
          type: integer
          minimum: 1
    Coupon:
      type: object
      required:
        - name
        - code
        - amount
        - startsOn
        - endsOn
        - maxUses
        - showOnReceipt
        - id
        - usedCount
        - version
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          $ref: "#/components/schemas/CouponCode"
        amount:
          $ref: "#/components/schemas/Money"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        maxUses:
          type: integer
          minimum: 1
          maximum: 2147483647
        showOnReceipt:
          type: boolean
        id:
          type: string
          format: uuid
        usedCount:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
    CouponSnapshot:
      type: object
      required: [ code, name, amount ]
      properties:
        code: { type: string }
        name: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
    CouponOffer:
      allOf:
        - $ref: '#/components/schemas/CouponSnapshot'
        - type: object
          required: [ endsOn ]
          properties:
            endsOn: { type: string, format: date }
    ModuleEntitlements:
      type: object
      required: [ coupons ]
      properties:
        coupons: { type: boolean, description: Effective coupon access; false while disabled }
        purchased:
          type: object
          description: Additive ownership metadata; disabling does not remove the purchase
          required: [ coupons ]
          properties:
            coupons: { type: boolean }
    CouponUsageReport:
      type: object
      required: [ items, total, page, limit, summary ]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, const: 10 }
        summary:
          type: object
          required: [ uses, discount ]
          properties:
            uses: { type: integer, minimum: 0 }
            discount: { type: string, pattern: '^\d+\.\d{2}$' }
        items:
          type: array
          items:
            type: object
            required: [ id, saleNo, code, name, amount, completedAt, status ]
            properties:
              id: { type: string, format: uuid }
              saleNo: { type: string }
              code: { type: string }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              completedAt: { type: string, format: date-time }
              status: { type: string, enum: [ COMPLETED, VOIDED ] }
    ActivityLog:
      type: object
      required:
        - id
        - action
        - entityId
        - actorUsername
        - requestId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        entityId:
          type: string
          format: uuid
        actorUsername:
          type:
            - string
            - "null"
        requestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    UUID:
      type: string
      format: uuid
    Money:
      type: string
      pattern: ^\d+\.\d{2}$
      examples:
        - "100.00"
        - "0.00"
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required:
        - page
        - limit
        - total
        - totalPages
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        requestId:
          $ref: "#/components/schemas/UUID"
      required:
        - success
        - error
        - requestId
    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
      required:
        - success
        - data
    UserContext:
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/UUID"
        orgId:
          $ref: "#/components/schemas/UUID"
        orgName:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
            - OWNER
            - EMPLOYEE
            - ACCOUNTANT
        permissions:
          type: array
          items:
            type: string
      required:
        - userId
        - orgId
        - orgName
        - username
        - role
        - permissions
    UserContextResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/UserContext"
      required:
        - success
        - data
    BootstrapRequest:
      type: object
      properties:
        storeMode:
          type: string
          enum: [RETAIL, CAFE]
          description: Optional for legacy callers; new stores default to RETAIL. Updates preserve mode when omitted.
        storeName:
          type: string
          minLength: 1
          maxLength: 120
        displayUsername:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: '^0[0-9]{8,9}$'
          maxLength: 10
      required:
        - storeName
        - displayUsername
        - phone
      additionalProperties: false
    BootstrapResult:
      type: object
      properties:
        orgId:
          $ref: "#/components/schemas/UUID"
        role:
          type: string
          const: OWNER
        status:
          type: string
          const: ACTIVE
        reservePayStatus:
          type: string
          enum: [PENDING, SENT, FAILED, UNKNOWN, NOT_CONFIGURED]
          description: External contact sync result; store provisioning succeeds independently
      required:
        - orgId
        - role
        - status
    BootstrapResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/BootstrapResult"
      required:
        - success
        - data
    Product:
      type: object
      properties:
        trackStock:
          type: boolean
          description: Effective stock policy; false only in CAFE mode. Omitted means tracked.
        id:
          $ref: "#/components/schemas/UUID"
        barcode:
          type: string
        name:
          type: string
        categoryId:
          type:
            - string
            - "null"
          format: uuid
        salePrice:
          $ref: "#/components/schemas/Money"
        quantityOnHand:
          type: integer
          minimum: 0
        rowVersion:
          type: integer
          minimum: 1
        imageUrl:
          description: Private signed image URL; POS catalog prefers a 600x440-bounded WebP thumbnail with original-image fallback. URLs can be reused for up to 10 minutes within the same API instance and user-token scope.
          type:
            - string
            - "null"
      required:
        - id
        - barcode
        - name
        - salePrice
        - quantityOnHand
        - rowVersion
    PosCatalogResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - items
            - total
            - page
            - limit
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Product"
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - success
        - data
        - meta
    CafeOption:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - price
        - enabled
        - isDefault
      properties:
        id: &a1
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          maxLength: 80
        price: &a2
          $ref: "#/components/schemas/Money"
        enabled:
          type: boolean
        isDefault:
          type: boolean
    CafeOptionSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - groupName
        - price
      properties:
        id: *a1
        name:
          type: string
        groupName:
          type: string
        price: *a2
    CafeGroupInput:
      type: object
      additionalProperties: false
      required:
        - name
        - minChoices
        - maxChoices
        - enabled
        - options
        - productIds
      properties:
        name: &a3
          type: string
          minLength: 1
          maxLength: 80
        minChoices: &a4
          type: integer
          minimum: 0
          maximum: 20
        maxChoices: &a5
          type: integer
          minimum: 1
          maximum: 20
        enabled: &a6
          type: boolean
        options: &a7
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/CafeOption"
        productIds: &a8
          type: array
          maxItems: 200
          uniqueItems: true
          items: *a1
    CafeGroupUpdate:
      type: object
      additionalProperties: false
      required:
        - name
        - minChoices
        - maxChoices
        - enabled
        - options
        - productIds
        - version
      properties:
        name: *a3
        minChoices: *a4
        maxChoices: *a5
        enabled: *a6
        options: *a7
        productIds: *a8
        version:
          type: integer
          minimum: 1
    CafeOptionGroup:
      type: object
      additionalProperties: false
      required:
        - name
        - minChoices
        - maxChoices
        - enabled
        - options
        - productIds
        - id
        - version
      properties:
        name: *a3
        minChoices: *a4
        maxChoices: *a5
        enabled: *a6
        options: *a7
        productIds: *a8
        id: *a1
        version:
          type: integer
          minimum: 1
    CafeConfiguration:
      type: object
      additionalProperties: false
      required:
        - storeMode
        - groups
      properties:
        storeMode:
          type: string
          enum:
            - RETAIL
            - CAFE
        groups:
          type: array
          items:
            $ref: "#/components/schemas/CafeOptionGroup"
    QuoteItemRequest:
      type: object
      properties:
        lineId: &a1
          $ref: "#/components/schemas/UUID"
        optionIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: *a1
        note:
          type: string
          maxLength: 200
        productId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity
      additionalProperties: false
    SaleItemRequest:
      type: object
      properties:
        lineId: &a1
          $ref: "#/components/schemas/UUID"
        optionIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: *a1
        note:
          type: string
          maxLength: 200
        expectedOptionsFingerprint:
          type: string
          pattern: ^[a-f0-9]{32}$
        productId:
          $ref: "#/components/schemas/UUID"
        quantity:
          type: integer
          minimum: 1
        expectedUnitPrice:
          $ref: "#/components/schemas/Money"
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity
        - expectedUnitPrice
        - expectedVersion
      additionalProperties: false
    QuoteRequest:
      type: object
      properties:
        couponCode:
          $ref: "#/components/schemas/CouponCode"
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/QuoteItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          type: string
          enum:
            - CASH
            - PROMPTPAY
      required:
        - items
        - discountAmount
        - paymentMethod
      additionalProperties: false
    QuoteResponseData:
      type: object
      properties:
        manualDiscountAmount:
          $ref: "#/components/schemas/Money"
        couponDiscountAmount:
          $ref: "#/components/schemas/Money"
        couponCode:
          $ref: "#/components/schemas/CouponCode"
        quoteFingerprint:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - barcode
              - name
              - quantity
              - unitPrice
              - expectedVersion
              - lineTotal
              - stockAvailable
            properties:
              lineId: &a1
                $ref: "#/components/schemas/UUID"
              optionIds:
                type: array
                maxItems: 100
                uniqueItems: true
                items: *a1
              note:
                type: string
                maxLength: 200
              baseUnitPrice: &a2
                $ref: "#/components/schemas/Money"
              options:
                type: array
                items:
                  $ref: "#/components/schemas/CafeOptionSnapshot"
              optionsFingerprint:
                type: string
                pattern: ^[a-f0-9]{32}$
              cafeSnapshot:
                type: object
                readOnly: true
                description: Server quote snapshot, stored by Gateway server only; not accepted
                  in cash sale input.
                required:
                  - baseUnitPrice
                  - options
                  - configuration
                properties:
                  baseUnitPrice: *a2
                  options:
                    type: array
                    items:
                      $ref: "#/components/schemas/CafeOptionSnapshot"
                  configuration:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - version
                      properties:
                        id: *a1
                        version:
                          type: integer
                          minimum: 1
              productId:
                $ref: "#/components/schemas/UUID"
              barcode:
                type: string
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 2147483647
              unitPrice:
                $ref: "#/components/schemas/Money"
              expectedVersion:
                type: integer
                minimum: 1
              lineTotal:
                $ref: "#/components/schemas/Money"
              stockAvailable:
                type: integer
                minimum: 0
        subtotalAmount:
          $ref: "#/components/schemas/Money"
        discountAmount:
          $ref: "#/components/schemas/Money"
        vatAmount:
          $ref: "#/components/schemas/Money"
        totalAmount:
          $ref: "#/components/schemas/Money"
        vatEnabled:
          type: boolean
        vatRate:
          $ref: "#/components/schemas/Money"
        promptpayQrPayload:
          type:
            - string
            - "null"
      required:
        - quoteFingerprint
        - items
        - subtotalAmount
        - discountAmount
        - vatAmount
        - vatEnabled
        - vatRate
        - totalAmount
    QuoteResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/QuoteResponseData"
      required:
        - success
        - data
    CashPayment:
      type: object
      properties:
        method:
          type: string
          const: CASH
        receivedAmount:
          $ref: "#/components/schemas/Money"
      required:
        - method
        - receivedAmount
      additionalProperties: false
    PromptpayPayment:
      type: object
      properties:
        method:
          type: string
          const: PROMPTPAY
        manualPaymentConfirmed:
          type: boolean
          const: true
      required:
        - method
        - manualPaymentConfirmed
      additionalProperties: false
    CashSaleRequest:
      type: object
      additionalProperties: false
      required:
        - items
        - discountAmount
        - expectedTotalAmount
        - payment
      properties:
        couponCode:
          $ref: "#/components/schemas/CouponCode"
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SaleItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        expectedTotalAmount:
          $ref: "#/components/schemas/Money"
        payment:
          $ref: "#/components/schemas/CashPayment"
    SaleRequest:
      type: object
      properties:
        couponCode:
          $ref: "#/components/schemas/CouponCode"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemRequest"
        discountAmount:
          $ref: "#/components/schemas/Money"
        expectedTotalAmount:
          $ref: "#/components/schemas/Money"
        payment:
          oneOf:
            - $ref: "#/components/schemas/CashPayment"
            - $ref: "#/components/schemas/PromptpayPayment"
      required:
        - items
        - discountAmount
        - expectedTotalAmount
        - payment
      additionalProperties: false
    ReceiptItem:
      type: object
      properties:
        lineId:
          $ref: "#/components/schemas/UUID"
        baseUnitPrice:
          $ref: "#/components/schemas/Money"
        options:
          type: array
          items:
            $ref: "#/components/schemas/CafeOptionSnapshot"
        note:
          type: string
          maxLength: 200
        barcode:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          $ref: "#/components/schemas/Money"
        discountAmount:
          $ref: "#/components/schemas/Money"
        lineTotal:
          $ref: "#/components/schemas/Money"
      required:
        - productName
        - quantity
        - unitPrice
        - lineTotal
    Receipt:
      type: object
      description: Immutable printer-neutral sale snapshot; void status may be
        overlaid without rewriting original amounts.
      properties:
        cafe:
          type: object
          description: Immutable queue snapshot. Absent on retail receipts. Queue date is the issuing day in Asia/Bangkok.
          required: [queueNo, queueDate]
          properties:
            queueNo:
              type: string
              pattern: '^A[0-9]{3,}$'
            queueDate:
              type: string
              format: date
        coupon:
          $ref: "#/components/schemas/CouponSnapshot"
        couponOffers:
          type: array
          items:
            $ref: "#/components/schemas/CouponOffer"
        receiptSchemaVersion:
          type: integer
          const: 1
        saleId:
          $ref: "#/components/schemas/UUID"
        saleNo:
          type: string
        completedAtUtc:
          type: string
          format: date-time
        store:
          type: object
          properties:
            name:
              type: string
            address:
              type: string
            phone:
              type: string
            taxId:
              type: string
            vatEnabled:
              type: boolean
            vatRate:
              $ref: "#/components/schemas/Money"
            footer:
              type: string
          required:
            - name
        cashierName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptItem"
        totals:
          type: object
          properties:
            subtotal:
              $ref: "#/components/schemas/Money"
            discount:
              $ref: "#/components/schemas/Money"
            vat:
              $ref: "#/components/schemas/Money"
            total:
              $ref: "#/components/schemas/Money"
            received:
              $ref: "#/components/schemas/Money"
            change:
              $ref: "#/components/schemas/Money"
          required:
            - subtotal
            - discount
            - vat
            - total
        paymentMethod:
          type: string
          enum:
            - CASH
            - PROMPTPAY
        saleStatus:
          type: string
          enum:
            - COMPLETED
            - VOIDED
      required:
        - receiptSchemaVersion
        - saleId
        - saleNo
        - completedAtUtc
        - store
        - items
        - totals
        - paymentMethod
        - saleStatus
    SaleResult:
      type: object
      properties:
        saleId:
          $ref: "#/components/schemas/UUID"
        saleNo:
          type: string
        status:
          type: string
          const: COMPLETED
        totalAmount:
          $ref: "#/components/schemas/Money"
        receivedAmount:
          $ref: "#/components/schemas/Money"
        changeAmount:
          $ref: "#/components/schemas/Money"
        replayed:
          type: boolean
        receipt:
          $ref: "#/components/schemas/Receipt"
      required:
        - saleId
        - saleNo
        - status
        - totalAmount
        - receivedAmount
        - changeAmount
        - receipt
    SaleResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/SaleResult"
      required:
        - success
        - data
    ReceiptResponse:
