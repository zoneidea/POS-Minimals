        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
  /client/config:
    get:
      tags: [System]
      operationId: getClientConfig
      summary: Public version and opt-in cross-platform integration metadata
      description: Default response preserves the existing three fields. profile=integration adds public protocol metadata, not credentials or shop entitlements.
      security: []
      x-roles: [public]
      parameters:
        - name: profile
          in: query
          required: false
          schema:
            type: string
            enum: [integration]
        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/ClientConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
  /orgs/bootstrap:
    post:
      tags:
        - Identity
      operationId: bootstrapOrganization
      summary: bootstrapOrganization
      x-roles:
        - Authenticated
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      parameters:
        - $ref: "#/components/parameters/ClientPlatform"
        - $ref: "#/components/parameters/ClientVersion"
  /auth/logout:
    post:
      operationId: revokeCurrentSession
      summary: Revoke the current POS session before clearing local Supabase authentication
      description: No request body. When Redis authority is configured, all access tokens for the current session_id are revoked until Thai midnight. The browser then signs out the local Supabase session. Other device sessions are unchanged.
      responses:
        '200':
          description: Current session revocation acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked:
                        type: boolean
                        const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Revocation unavailable; retain the local session and retry
  /auth/session-policy:
    get:
      operationId: readSessionDayPolicy
      summary: Authenticated session expiry at midnight Asia/Bangkok on its creation day
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expiry belongs to the current authenticated Supabase session; token refresh does not extend it
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      expiresAt:
                        type: string
                        format: date-time
                    required: [expiresAt]
                required: [success, data]
        '401':
          description: Missing session or SESSION_DAY_EXPIRED; sign in again rather than refresh
        '503':
          description: Cannot establish session expiry; protected API fails closed
  /auth/me:
    get:
      tags:
