      description: Identity or database provider unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Validation of business rule failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    File:
      description: Authenticated XLSX binary
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    NotFound:
      description: Resource unavailable in the authenticated shop
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    SaleId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AuditId:
      name: auditId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    Type:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum:
          - sales
          - inventory
          - low-stock
          - stock-valuation
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      schema:
        type: string
        enum:
          - WEB
          - JAVAFX
          - ANDROID
          - IOS
          - OTHER
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string
paths:
  /marketplace/entitlements:
    get:
      operationId: getModuleEntitlements
      summary: Read active store module access
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/ModuleEntitlements'
        '403':
          description: Role or module is unavailable
  /marketplace/coupons/demo-purchase:
    post:
      operationId: demoPurchaseCoupons
      summary: Owner demo purchase; free, idempotent, no actual payment
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/ModuleEntitlements'
        '403':
          description: Role or module is unavailable
  /marketplace/modules/{code}:
    patch:
      operationId: setModuleEnabled
      summary: Owner enables or disables an already acquired module without buying it again
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, enum: [ coupons ] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ enabled ]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Effective access and retained ownership
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ModuleEntitlements' }
        '400':
          description: Invalid module or enabled flag
        '403':
          description: Owner role required
        '409':
          description: Module has not been purchased
  /coupons:
    get:
      operationId: listCoupons
      summary: Owner coupon list; requires module entitlement
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [ items, total, page, limit ]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Coupon' }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer, const: 10 }
        '403':
          description: Role or module is unavailable
    post:
      operationId: createCoupon
      summary: Owner creates a coupon; amount is fixed THB discount, not sale price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/Coupon'
  /coupons/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid }
        }
    patch:
      operationId: updateCoupon
      summary: Owner updates coupon with expected version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponUpdate"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/Coupon'
        '403':
          description: Role or module is unavailable
    delete:
      operationId: softDeleteCoupon
      summary: Owner soft-deletes coupon, preserving usage ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ version ]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/Coupon'
        '403':
          description: Role or module is unavailable
  /reports/coupons:
    get:
      operationId: couponUsageReport
      summary: Owner/accountant coupon usage with Thai-day inclusive dates; module
        required
      parameters:
        - {
            name: from,
            in: query,
            required: true,
            schema: { type: string, format: date }
          }
        - {
            name: to,
            in: query,
            required: true,
            schema: { type: string, format: date }
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [ success, data ]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    $ref: '#/components/schemas/CouponUsageReport'
        '403':
          description: Role or module is unavailable
  /payments/config:
    get:
      operationId: getPaymentConfiguration
      summary: Active shop payment configuration; bank data is masked and omitted for employees
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration; gatewayReady is false until a provider is integrated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      mode:
                        enum: [DISABLED, UPLOAD, GATEWAY]
                      qrImage:
                        type: string
                      gatewayReady:
                        const: false
                      version:
                        type: integer
                      bankCode:
                        type: string
                      accountName:
                        type: string
                        description: Account holder name; only owner/accountant may read
                      maskedAccountNumber:
                        type: string
                    required: [mode, qrImage, gatewayReady, version]
                required: [success, data]
  /settings/payments/unlink-bank:
    post:
      operationId: unlinkPaymentBankAccount
      summary: Owner-only unlink at ReservePay then soft-delete the saved bank account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: integer
                  minimum: 1
              required: [version]
      responses:
        '200':
          description: External unlink confirmed or contact and bank independently confirmed absent; local encrypted account soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      version:
                        type: integer
                    required: [version]
                required: [success, data]
        '403':
          description: Owner required
        '404':
          description: No saved bank account
        '409':
          description: Stale version or local conflict after confirmed external unlink; reconcile before further changes
        '503':
          description: External unlink not confirmed; local account remains active; no automatic retry
  /settings/payments:
    patch:
      operationId: savePaymentConfiguration
      summary: Owner-only versioned payment configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  enum: [DISABLED, UPLOAD, GATEWAY]
                qrImage:
                  type: string
                  maxLength: 50000
                  description: PNG/JPEG data URL or empty; validated as a raster image
                bankCode:
                  type: string
                  description: Three-digit bank code from the supported bank list or empty
                accountName:
                  type: string
                  maxLength: 150
                  description: Trimmed account holder name; required for GATEWAY; sent as ReservePay name
                accountNumber:
                  type: string
                  pattern: '^(|[0-9]{6,20})$'
                  description: Empty retains saved account; required when switching bank
                version:
                  type: integer
                  minimum: 1
              required: [mode, qrImage, bankCode, accountNumber, version]
      responses:
        '200':
          description: Saved version and optional ReservePay bank-link status; local save succeeds independently
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      version:
                        type: integer
                      bankLinkStatus:
                        enum: [PENDING, SENT, FAILED, UNKNOWN, NOT_CONFIGURED]
                    required: [version]
                required: [success, data]
        '400':
          description: Invalid settings
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Stale version
  /audits/activity-logs:
    get:
      summary: Owner activity history retained for 30 days
      operationId: listActivityLogs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: action
          schema:
            type: string
            pattern: ^[A-Z_]{1,60}$
      responses:
        "200":
          description: Tenant-scoped history, 10 rows per page
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required:
                      - items
                      - total
                      - page
                      - limit
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ActivityLog"
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        minimum: 1
                      limit:
                        const: 10
        "400":
          description: Invalid query
        "401":
          description: Authentication required
        "403":
          description: Owner required
        "503":
          description: History unavailable

  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: getHealth
      x-roles:
        - public
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
